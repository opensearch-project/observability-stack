[project]
name = "weather-agent"
version = "1.0.0"
description = "Plain Python weather agent with OpenTelemetry instrumentation for Observability Stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opensearch-genai-observability-sdk-py @ git+https://github.com/opensearch-project/genai-observability-sdk-py@main",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[tool.uv]
constraint-dependencies = ["starlette>=1.3.1", "idna>=3.15"]
