{{- if index .Values "opensearch-dashboards" "enabled" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "observability-stack.fullname" . }}-init-dashboards
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init-dashboards
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-dashboards
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install -q requests pyyaml && python -u /scripts/init-opensearch-dashboards.py
          env:
            - name: OPENSEARCH_USER
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: username
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: password
            - name: BASE_URL
              value: "http://{{ .Release.Name }}-opensearch-dashboards:5601"
            - name: PROMETHEUS_HOST
              value: "{{ .Release.Name }}-prometheus-server"
            - name: PROMETHEUS_PORT
              value: "80"
            - name: ALERTMANAGER_HOST
              value: "{{ .Release.Name }}-alertmanager"
            - name: ALERTMANAGER_PORT
              value: "9093"
            - name: OPENSEARCH_ENDPOINT
              value: "https://{{ .Values.opensearchServiceName | default "opensearch-cluster-master" }}:9200"
            - name: ANONYMOUS_AUTH_ENABLED
              value: {{ ((.Values.anonymousAuth).enabled) | default false | quote }}
            - name: INSTALL_EBPF_EXAMPLE_DASHBOARD
              value: {{ .Values.ebpfDemo.enabled | default false | quote }}
            - name: ISM_RETENTION_DAYS
              value: {{ include "observability-stack.ismRetentionDays" . | quote }}
            - name: EVALUATION_FILES_DIR
              value: "/genai-evaluation"
          volumeMounts:
            - name: init-script
              mountPath: /scripts
            - name: init-script
              mountPath: /config
            # Not under /config: a mount nested in the init-script ConfigMap volume is fragile
            - name: genai-evaluation
              mountPath: /genai-evaluation
              readOnly: true
      volumes:
        - name: init-script
          configMap:
            name: {{ include "observability-stack.fullname" . }}-init-script
        # Evaluation template and policy for ensure_evaluation_index(); rendered with Data
        # Prepper (genai-evaluation-index-configmap.yaml). Optional: without it the step is skipped.
        - name: genai-evaluation
          configMap:
            name: genai-evaluation-index-init
            optional: true
{{- end }}
