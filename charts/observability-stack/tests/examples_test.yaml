suite: example agents
templates:
  - templates/examples.yaml
tests:
  - it: should render all example deployments and services by default
    asserts:
      - hasDocuments:
          count: 10  # 4 services + 6 deployments
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: example-weather-agent
          any: true
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: example-events-agent
          any: true
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: example-travel-planner
          any: true
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: example-mcp-server
          any: true
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: example-canary
          any: true
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: weather-agent
          any: true

  - it: should not render when disabled
    set:
      examples.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should set OTEL_EXPORTER_OTLP_ENDPOINT on weather-agent
    documentSelector:
      path: metadata.name
      value: example-weather-agent
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://RELEASE-NAME-opentelemetry-collector:4317"

  - it: should set canary interval from values
    set:
      examples.canary.interval: "60"
    documentSelector:
      path: metadata.name
      value: example-canary
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CANARY_INTERVAL
            value: "60"

  - it: should render the agent eval canary with the examples
    documentSelector:
      path: metadata.name
      value: example-agent-eval-canary
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/kylehounslow/observability-stack/agent-eval-canary:latest
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENSEARCH_HOST
            value: https://opensearch-cluster-master:9200
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENSEARCH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: opensearch-credentials
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://RELEASE-NAME-opentelemetry-collector:4317
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRAVEL_PLANNER_URL
            value: http://travel-planner:8000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EVAL_CANARY_SUITE_INTERVAL_MINUTES
            value: "30"

  - it: should follow opensearchServiceName and allow turning the suite off
    set:
      opensearchServiceName: my-opensearch
      examples.agentEvalCanary.suiteIntervalMinutes: "0"
    documentSelector:
      path: metadata.name
      value: example-agent-eval-canary
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENSEARCH_HOST
            value: https://my-opensearch:9200
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EVAL_CANARY_SUITE_INTERVAL_MINUTES
            value: "0"

  - it: should not render the agent eval canary when it is disabled
    set:
      examples.agentEvalCanary.enabled: false
    asserts:
      - hasDocuments:
          count: 9
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: example-agent-eval-canary
          any: true
        not: true
