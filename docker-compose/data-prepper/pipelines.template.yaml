# Data Prepper Pipeline Configuration
# Processes and transforms logs, traces, and metrics before writing to OpenSearch

# Main OTLP pipeline - receives all telemetry and routes by type
otlp-pipeline:
  delay: 10
  source:
    # OTLP source receives telemetry via OpenTelemetry Protocol
    otlp:
      # Listen on port 21890 for gRPC connections from OpenTelemetry Collector
      port: 21890
      # Disable SSL for development
      ssl: false
  # Route telemetry by signal type
  route:
    # GenAI evaluation results (OTel log events named gen_ai.evaluation.result) go only to
    # the evaluation index, never to the logs index.
    - logs: "getEventType() == \"LOG\" and /eventName != \"gen_ai.evaluation.result\""
    - evaluations: "getEventType() == \"LOG\" and /eventName == \"gen_ai.evaluation.result\""
    - traces: "getEventType() == \"TRACE\""
  # Send to appropriate sub-pipelines
  sink:
    - pipeline:
        name: "otel-logs-pipeline"
        routes:
          - "logs"
    - pipeline:
        name: "otel-evaluations-pipeline"
        routes:
          - "evaluations"
    - pipeline:
        name: "otel-traces-pipeline"
        routes:
          - "traces"

# Log processing pipeline
# Receives logs from main pipeline and writes to OpenSearch
otel-logs-pipeline:
  workers: 5
  delay: 10
  source:
    pipeline:
      name: "otlp-pipeline"
  buffer:
    bounded_blocking:
  processor:
    - copy_values:
        entries:
          - from_key: "time"
            to_key: "@timestamp"
  # Write processed logs to OpenSearch
  sink:
    - opensearch:
        hosts: ["OPENSEARCH_PROTOCOL://OPENSEARCH_HOST:OPENSEARCH_PORT"]
        username: OPENSEARCH_USER
        password: OPENSEARCH_PASSWORD
        # Disable SSL verification for development
        insecure: true
        # Use log analytics index type for automatic index management
        index_type: log-analytics-plain

# GenAI evaluation results pipeline (Agent Evaluations)
# gen_ai.evaluation.result log events go to the write alias otel-v1-genai-evaluation over
# otel-v1-genai-evaluation-000001, -000002, ... The genai-evaluation-index-init job (see
# docker-compose.local-opensearch.yml) creates the ISM rollover policy, the index template and the
# first index with the alias before Data Prepper starts, the same way the AWS installer prepares a
# managed domain. The template below is the whole evaluation template inlined, identical to
# otel-v1-genai-evaluation-index-template.json without index_patterns (the sink sets those); it is
# not replaced while the installed template has the same or a higher version.
otel-evaluations-pipeline:
  delay: 10
  source:
    pipeline:
      name: "otlp-pipeline"
  processor:
    # The Agent Evaluations UI filters on @timestamp
    - copy_values:
        entries:
          - from_key: "time"
            to_key: "@timestamp"
  sink:
    - opensearch:
        hosts: ["OPENSEARCH_PROTOCOL://OPENSEARCH_HOST:OPENSEARCH_PORT"]
        username: OPENSEARCH_USER
        password: OPENSEARCH_PASSWORD
        insecure: true
        index_type: custom
        index: otel-v1-genai-evaluation
        template_type: index-template
        template_content: |
          {
            "version": 1,
            "priority": 100,
            "template": {
              "settings": {
                "plugins.index_state_management.rollover_alias": "otel-v1-genai-evaluation"
              },
              "mappings": {
                "date_detection": false,
                "_source": {
                  "enabled": true
                },
                "dynamic_templates": [
                  {
                    "long_resource_attributes": {
                      "mapping": {
                        "type": "long"
                      },
                      "path_match": "resource.attributes.*",
                      "match_mapping_type": "long"
                    }
                  },
                  {
                    "double_resource_attributes": {
                      "mapping": {
                        "type": "double"
                      },
                      "path_match": "resource.attributes.*",
                      "match_mapping_type": "double"
                    }
                  },
                  {
                    "string_resource_attributes": {
                      "mapping": {
                        "type": "keyword",
                        "ignore_above": 256
                      },
                      "path_match": "resource.attributes.*",
                      "match_mapping_type": "string"
                    }
                  },
                  {
                    "long_scope_attributes": {
                      "mapping": {
                        "type": "long"
                      },
                      "path_match": "instrumentationScope.attributes.*",
                      "match_mapping_type": "long"
                    }
                  },
                  {
                    "double_scope_attributes": {
                      "mapping": {
                        "type": "double"
                      },
                      "path_match": "instrumentationScope.attributes.*",
                      "match_mapping_type": "double"
                    }
                  },
                  {
                    "string_scope_attributes": {
                      "mapping": {
                        "type": "keyword",
                        "ignore_above": 256
                      },
                      "path_match": "instrumentationScope.attributes.*",
                      "match_mapping_type": "string"
                    }
                  },
                  {
                    "long_attributes": {
                      "mapping": {
                        "type": "long"
                      },
                      "path_match": "attributes.*",
                      "match_mapping_type": "long"
                    }
                  },
                  {
                    "double_attributes": {
                      "mapping": {
                        "type": "double"
                      },
                      "path_match": "attributes.*",
                      "match_mapping_type": "double"
                    }
                  },
                  {
                    "string_attributes": {
                      "mapping": {
                        "type": "keyword",
                        "ignore_above": 256
                      },
                      "path_match": "attributes.*",
                      "match_mapping_type": "string"
                    }
                  }
                ],
                "properties": {
                  "droppedAttributesCount": {
                    "type": "integer"
                  },
                  "instrumentationScope": {
                    "properties": {
                      "droppedAttributesCount": {
                        "type": "integer"
                      },
                      "schemaUrl": {
                        "type": "keyword",
                        "ignore_above": 256
                      },
                      "name": {
                        "type": "keyword",
                        "ignore_above": 128
                      },
                      "version": {
                        "type": "keyword",
                        "ignore_above": 64
                      }
                    }
                  },
                  "resource": {
                    "properties": {
                      "droppedAttributesCount": {
                        "type": "integer"
                      },
                      "schemaUrl": {
                        "type": "keyword",
                        "ignore_above": 256
                      }
                    }
                  },
                  "severity": {
                    "properties": {
                      "number": {
                        "type": "integer"
                      },
                      "text": {
                        "type": "keyword",
                        "ignore_above": 32
                      }
                    }
                  },
                  "body": {
                    "type": "text"
                  },
                  "@timestamp": {
                    "type": "date_nanos"
                  },
                  "time": {
                    "type": "date_nanos"
                  },
                  "observedTime": {
                    "type": "date_nanos"
                  },
                  "traceId": {
                    "type": "keyword",
                    "ignore_above": 32
                  },
                  "spanId": {
                    "type": "keyword",
                    "ignore_above": 16
                  },
                  "eventName": {
                    "type": "text",
                    "fields": {
                      "keyword": {
                        "type": "keyword",
                        "ignore_above": 256
                      }
                    }
                  },
                  "flags": {
                    "type": "long"
                  },
                  "attributes": {
                    "properties": {
                      "gen_ai": {
                        "properties": {
                          "evaluation": {
                            "properties": {
                              "score": {
                                "properties": {
                                  "value": {
                                    "type": "double"
                                  },
                                  "label": {
                                    "type": "keyword",
                                    "ignore_above": 256
                                  }
                                }
                              },
                              "explanation": {
                                "type": "text"
                              },
                              "name": {
                                "type": "keyword",
                                "ignore_above": 256
                              }
                            }
                          },
                          "agent": {
                            "properties": {
                              "version": {
                                "type": "keyword",
                                "ignore_above": 256
                              },
                              "name": {
                                "type": "keyword",
                                "ignore_above": 256
                              }
                            }
                          },
                          "prompt": {
                            "properties": {
                              "version": {
                                "type": "keyword",
                                "ignore_above": 256
                              }
                            }
                          },
                          "conversation": {
                            "properties": {
                              "id": {
                                "type": "keyword",
                                "ignore_above": 256
                              }
                            }
                          }
                        }
                      },
                      "opensearch": {
                        "properties": {
                          "gen_ai": {
                            "properties": {
                              "evaluation": {
                                "properties": {
                                  "score": {
                                    "properties": {
                                      "min": {
                                        "type": "double"
                                      },
                                      "max": {
                                        "type": "double"
                                      },
                                      "threshold": {
                                        "type": "double"
                                      },
                                      "direction": {
                                        "type": "keyword",
                                        "ignore_above": 256
                                      }
                                    }
                                  },
                                  "evaluator": {
                                    "properties": {
                                      "version": {
                                        "type": "keyword",
                                        "ignore_above": 256
                                      }
                                    }
                                  },
                                  "level": {
                                    "type": "keyword",
                                    "ignore_above": 256
                                  }
                                }
                              }
                            }
                          }
                        }
                      },
                      "test": {
                        "properties": {
                          "case": {
                            "properties": {
                              "id": {
                                "type": "keyword",
                                "ignore_above": 256
                              }
                            }
                          },
                          "suite": {
                            "properties": {
                              "run": {
                                "properties": {
                                  "id": {
                                    "type": "keyword",
                                    "ignore_above": 256
                                  }
                                }
                              },
                              "name": {
                                "type": "keyword",
                                "ignore_above": 256
                              }
                            }
                          }
                        }
                      },
                      "error": {
                        "properties": {
                          "type": {
                            "type": "keyword",
                            "ignore_above": 256
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }

# Trace processing pipeline
# Receives traces from main pipeline and distributes to raw and service map pipelines
otel-traces-pipeline:
  delay: 100
  source:
    pipeline:
      name: "otlp-pipeline"
  # Send traces to both raw storage and service map generation
  sink:
    - pipeline:
        name: "traces-raw-pipeline"
    - pipeline:
        name: "service-map-pipeline"

# Raw trace storage pipeline
# Stores individual trace spans in OpenSearch
traces-raw-pipeline:
  source:
    pipeline:
      name: "otel-traces-pipeline"
  processor:
    # Process raw trace data for OpenSearch storage
    - otel_traces:
  sink:
    - opensearch:
        hosts: ["OPENSEARCH_PROTOCOL://OPENSEARCH_HOST:OPENSEARCH_PORT"]
        username: OPENSEARCH_USER
        password: OPENSEARCH_PASSWORD
        insecure: true
        # Use trace analytics index type for automatic index management
        index_type: trace-analytics-plain-raw

# Service map generation pipeline (APM)
# Builds service dependency maps and RED metrics from trace relationships.
# Splits into two sub-pipelines so we can strip high-cardinality `randomKey`
# labels from the Cortex branch without polluting the service-map branch.
service-map-pipeline:
  delay: 100
  source:
    pipeline:
      name: "otel-traces-pipeline"
  processor:
    # APM service map processor - generates topology, service details, and RED metrics
    - otel_apm_service_map:
        group_by_attributes: [telemetry.sdk.language]
        window_duration: 10s
  route:
    - otel_apm_service_map_route: 'getEventType() == "SERVICE_MAP"'
    - service_processed_metrics: 'getEventType() == "METRIC"'
  sink:
    - opensearch:
        hosts: ["OPENSEARCH_PROTOCOL://OPENSEARCH_HOST:OPENSEARCH_PORT"]
        username: OPENSEARCH_USER
        password: OPENSEARCH_PASSWORD
        index_type: otel-v2-apm-service-map
        routes: [otel_apm_service_map_route]
        insecure: true
    # Fan out service-derived RED metrics to a dedicated pipeline that strips
    # the per-event randomKey UUID before Cortex rejects it for cardinality.
    - pipeline:
        name: "service-metrics-cortex-pipeline"
        routes: [service_processed_metrics]

# Strips the per-event `randomKey` UUID from span-derived RED metrics
# before the Cortex remote-write sink. Without this, data-prepper tags
# every latency bucket with a fresh UUID, blowing past Cortex's default
# 50k series-per-metric limit in minutes.
service-metrics-cortex-pipeline:
  delay: 100
  source:
    pipeline:
      name: "service-map-pipeline"
  processor:
    # Drop only the per-event randomKey. Do NOT strip telemetry.sdk.language:
    # otel_apm_service_map is configured to group_by it and emits one sample
    # per (service, operation, remoteService, sdk.language) per window, so
    # removing the label collapses multi-language services onto the same
    # series+timestamp and Cortex rejects them as duplicate samples.
    # Note: data-prepper event keys use JSON-pointer-style paths; labels
    # set by otel_apm_service_map land under /attributes/<key>, so both
    # the top-level and attributes-scoped paths are listed to be safe.
    - delete_entries:
        with_keys:
          - "/attributes/randomKey"
          - "randomKey"
  sink:
    # Route RED metrics to local Cortex via remote write.
    # Cortex's distributor push endpoint is /api/v1/push (not Prometheus's /api/v1/write).
    - prometheus:
        url: "http://PROMETHEUS_HOST:PROMETHEUS_PORT/api/v1/push"
        insecure: true
        threshold:
          max_events: 500
          flush_interval: 5s