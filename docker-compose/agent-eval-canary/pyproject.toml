[project]
name = "agent-eval-canary"
version = "0.3.0"
description = "Deterministic online and offline evaluations of the example agents"
requires-python = ">=3.10"
dependencies = [
    # From git main until 0.3.0 is on PyPI (run names, judge context, scorer ownership)
    "opensearch-genai-observability-sdk-py[opensearch] @ git+https://github.com/opensearch-project/genai-observability-sdk-py@main",
    "opentelemetry-exporter-otlp-proto-grpc",
    "requests",
]

[tool.uv]
# CVE-2026-45409 (GHSA-65pc-fj4g-8rjx): idna.encode() DoS, fixed in 3.15.
# idna is transitive (via requests, through the SDK) and not imported here,
# so floor it as a constraint rather than a direct dependency.
constraint-dependencies = ["idna>=3.15"]
